name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: |
          $scannerArchive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scannerDirectory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          $expectedSha256 = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $scannerArchive
          if ((Get-FileHash -LiteralPath $scannerArchive -Algorithm SHA256).Hash -ne $expectedSha256) {
            throw 'Gitleaks archive checksum does not match the pinned release.'
          }
          Expand-Archive -LiteralPath $scannerArchive -DestinationPath $scannerDirectory
          & (Join-Path $scannerDirectory 'gitleaks.exe') git --redact=100 --no-banner --log-opts='--all' .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Migrate and test against native PostgreSQL
        env:
          RUN_BROWSER_TESTS: "1"
          RUN_INTEGRATION_COVERAGE: "1"
        run: ./scripts/test-postgres-windows.ps1
      - name: Audit dependencies
        run: npm audit --audit-level=high
